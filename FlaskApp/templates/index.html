<html>
    <head>
        <title>Flask App</title>
    </head>
    <body>
        <h1>Hello World!</h1>
        <form class = "grid" action = "/result" method = "POST">
            <center>
                {% if name %}
                    <h3 style = "color: blue;">Hello {{ name }}! How are ya?</h3>
                {% endif %}
            </center>
            
            <label for = "Name">Enter your name, please:</label>
            <input type = "text" name = "name" id = "name">
            <center><input type = "Submit" class = "file_submit"></center>
        </form>
    </body>
</html>
